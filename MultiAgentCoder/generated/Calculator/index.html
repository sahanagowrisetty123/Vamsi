<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="navbar" class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Calculator</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <section id="hero" class="bg-light text-center p-5">
        <h1 class="display-4">Simple Calculator</h1>
        <p class="lead">Perform basic and advanced calculations with ease.</p>
    </section>
    <section id="calculator" class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <input id="display" type="text" class="form-control" disabled>
                        <div class="row mt-3">
                            <div class="col-md-3">
                                <button id="clear" class="btn btn-secondary w-100">C</button>
                            </div>
                            <div class="col-md-3">
                                <button id="backspace" class="btn btn-secondary w-100"><i class="bi bi-backspace"></i></button>
                            </div>
                            <div class="col-md-3">
                                <button id="divide" class="btn btn-secondary w-100">/</button>
                            </div>
                            <div class="col-md-3">
                                <button id="multiply" class="btn btn-secondary w-100">*</button>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-3">
                                <button id="seven" class="btn btn-secondary w-100">7</button>
                            </div>
                            <div class="col-md-3">
                                <button id="eight" class="btn btn-secondary w-100">8</button>
                            </div>
                            <div class="col-md-3">
                                <button id="nine" class="btn btn-secondary w-100">9</button>
                            </div>
                            <div class="col-md-3">
                                <button id="subtract" class="btn btn-secondary w-100">-</button>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-3">
                                <button id="four" class="btn btn-secondary w-100">4</button>
                            </div>
                            <div class="col-md-3">
                                <button id="five" class="btn btn-secondary w-100">5</button>
                            </div>
                            <div class="col-md-3">
                                <button id="six" class="btn btn-secondary w-100">6</button>
                            </div>
                            <div class="col-md-3">
                                <button id="add" class="btn btn-secondary w-100">+</button>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-3">
                                <button id="one" class="btn btn-secondary w-100">1</button>
                            </div>
                            <div class="col-md-3">
                                <button id="two" class="btn btn-secondary w-100">2</button>
                            </div>
                            <div class="col-md-3">
                                <button id="three" class="btn btn-secondary w-100">3</button>
                            </div>
                            <div class="col-md-3">
                                <button id="equals" class="btn btn-primary w-100">=</button>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <button id="zero" class="btn btn-secondary w-100">0</button>
                            </div>
                            <div class="col-md-3">
                                <button id="decimal" class="btn btn-secondary w-100">.</button>
                            </div>
                            <div class="col-md-3">
                                <button id="percent" class="btn btn-secondary w-100">%</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section id="history" class="container mt-5">
        <h2>Calculation History</h2>
        <ul id="history-list" class="list-group">
        </ul>
    </section>
    <footer id="footer" class="bg-light text-center p-3 mt-5">
        <p>&copy; 2024 Calculator</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
